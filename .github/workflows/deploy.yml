# .github/workflows/deploy.yml
# Publica el sitio en GitHub Pages automáticamente cada vez que subes
# cambios a la rama "main". También se puede ejecutar a mano desde la
# pestaña "Actions" del repositorio (botón "Run workflow").
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para leer el código y publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicaciones seguidas, se cancela la anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Compilar el sitio (genera la carpeta dist/)
        run: npm run build

      - name: Preparar los archivos para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
